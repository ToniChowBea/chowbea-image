# Run API tests (with Ghostscript) and web tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Install Ghostscript and libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libvips42 libvips-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install Python dependencies
        run: uv sync --frozen --group dev
      - name: Run pytest
        run: uv run pytest -q

  web:
    name: Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Run vitest
        run: bun run test
