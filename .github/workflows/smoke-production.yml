# Daily production smoke test: verify img.chowbea.com is live and working.
# Runs Monday-Friday at 9 AM UTC. No secrets required.
# The web app (img.chowbea.com) and the API (a separate Railway service) live on
# different hosts, and the API routes have no /api prefix.
name: Production Smoke Test

on:
  schedule:
    # 9 AM UTC on weekdays (cron: minute hour day-of-month month day-of-week)
    - cron: "0 9 * * 1-5"
  workflow_dispatch: # Allow manual runs

env:
  WEB_URL: https://img.chowbea.com
  API_URL: https://chowbea-image-production.up.railway.app

jobs:
  smoke-test:
    name: Smoke test production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check API health endpoint
        run: |
          echo "Testing GET /health on API..."
          response=$(curl -s -o /dev/null -w "%{http_code}" $API_URL/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "✓ API health check passed (HTTP $response)"
          elif [ "$response" = "000" ]; then
            echo "✗ API is unreachable (network error)"
            exit 1
          else
            echo "✗ API health check failed (HTTP $response)"
            exit 1
          fi

      - name: Check key web routes
        run: |
          # Small sample of public pages. Do not fetch every /guides/<preset>:
          # uk-passport-online is a photo guide and universal-credit is a document
          # guide, so the two cover both conversion-CTA shapes without the full set.
          paths=(
            /
            /fix
            /portals
            /guides
            /guides/uk-passport-online
            /guides/universal-credit
          )
          failed=0
          for path in "${paths[@]}"; do
            echo "Testing GET $path on web..."
            response=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL$path" || echo "000")
            if [ "$response" = "200" ]; then
              echo "✓ $path loaded (HTTP $response)"
            elif [ "$response" = "000" ]; then
              echo "✗ $path unreachable (network error)"
              failed=1
            else
              echo "✗ $path failed (HTTP $response)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Check sitemap includes guides
        run: |
          echo "Testing GET /sitemap.xml on web..."
          http_code=$(curl -s -o sitemap-body.xml -w "%{http_code}" "$WEB_URL/sitemap.xml" || echo "000")
          if [ "$http_code" != "200" ]; then
            if [ "$http_code" = "000" ]; then
              echo "✗ sitemap.xml unreachable (network error)"
            else
              echo "✗ sitemap.xml failed (HTTP $http_code)"
            fi
            exit 1
          fi
          echo "✓ sitemap.xml loaded (HTTP $http_code)"
          if grep -q "/guides" sitemap-body.xml; then
            echo "✓ sitemap.xml contains /guides"
          else
            echo "✗ sitemap.xml missing /guides"
            exit 1
          fi

      - name: Test API presets endpoint
        run: |
          echo "Testing GET /presets on API..."
          response=$(curl -s $API_URL/presets)
          http_code=$(curl -s -o /dev/null -w "%{http_code}" $API_URL/presets || echo "000")
          
          if [ "$http_code" != "200" ]; then
            echo "✗ Presets API failed (HTTP $http_code)"
            exit 1
          fi
          
          # Check JSON structure
          preset_count=$(echo "$response" | jq -r '.presets | length' 2>/dev/null || echo "0")
          if [ "$preset_count" -ge "31" ]; then
            echo "✓ Presets API returned $preset_count presets (expected ≥31)"
          else
            echo "✗ Presets API returned only $preset_count presets (expected ≥31)"
            exit 1
          fi

      - name: Check API stats endpoint
        run: |
          echo "Testing GET /stats on API (aggregates only)..."
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          url = os.environ["API_URL"].rstrip("/") + "/stats"
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  code = response.getcode()
                  body = response.read()
          except urllib.error.URLError as exc:
              print(f"✗ /stats unreachable ({exc})")
              sys.exit(1)
          if code != 200:
              print(f"✗ /stats failed (HTTP {code})")
              sys.exit(1)
          try:
              data = json.loads(body)
          except json.JSONDecodeError:
              print("✗ /stats did not return JSON")
              sys.exit(1)

          keys = {"started", "passed", "failed", "packs", "paywall_would_trigger"}

          def check_counts(counts, label):
              if not isinstance(counts, dict) or set(counts) != keys:
                  raise ValueError(f"{label} missing count keys {keys}")
              for name, value in counts.items():
                  if type(value) is not int or value < 0:
                      raise ValueError(f"{label}.{name} is not a non-negative int")

          if not isinstance(data, dict) or "totals" not in data or "days" not in data:
              print("✗ /stats JSON missing totals/days")
              sys.exit(1)
          if not isinstance(data["totals"], dict) or not isinstance(data["days"], list):
              print("✗ /stats totals/days have the wrong types")
              sys.exit(1)
          try:
              for preset, counts in data["totals"].items():
                  if not isinstance(preset, str) or not preset:
                      raise ValueError("empty preset id in totals")
                  check_counts(counts, f"totals.{preset}")
              for i, day in enumerate(data["days"]):
                  if not isinstance(day, dict) or "date" not in day or "presets" not in day:
                      raise ValueError(f"days[{i}] missing date/presets")
                  if not isinstance(day["date"], str) or len(day["date"]) != 10:
                      raise ValueError(f"days[{i}].date is not YYYY-MM-DD")
                  if not isinstance(day["presets"], dict):
                      raise ValueError(f"days[{i}].presets is not an object")
                  for preset, counts in day["presets"].items():
                      check_counts(counts, f"days[{i}].presets.{preset}")
          except ValueError as exc:
              print(f"✗ /stats shape: {exc}")
              sys.exit(1)
          print("✓ /stats returned HTTP 200 with aggregate shape")
          PY

      - name: Install dependencies for end-to-end test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick jq

      - name: Run end-to-end fix job
        run: |
          echo "Creating a small test JPEG..."
          # Create a 100x100 red square JPEG (should be under 10KB)
          convert -size 100x100 xc:red -quality 85 test-input.jpg
          input_size=$(stat -f%z test-input.jpg 2>/dev/null || stat -c%s test-input.jpg)
          echo "Created test-input.jpg ($input_size bytes)"
          
          echo "Submitting fix job to API..."
          # Submit to jpg-100kb preset (generic 100KB target)
          submit_response=$(curl -s -X POST \
            "$API_URL/img/fix" \
            -F "files=@test-input.jpg" \
            -F "preset=jpg-100kb" \
            -w "\n%{http_code}")
          
          http_code=$(echo "$submit_response" | tail -n1)
          response_body=$(echo "$submit_response" | head -n-1)
          
          if [ "$http_code" != "202" ]; then
            echo "✗ Fix job submission failed (HTTP $http_code)"
            echo "Response: $response_body"
            exit 1
          fi
          
          job_id=$(echo "$response_body" | jq -r '.job_id' 2>/dev/null || echo "")
          if [ -z "$job_id" ] || [ "$job_id" = "null" ]; then
            echo "✗ No job_id in response"
            echo "Response: $response_body"
            exit 1
          fi
          
          echo "✓ Job submitted: $job_id"
          
          # Poll for completion (max 30 seconds)
          echo "Polling job status..."
          for i in $(seq 1 30); do
            status_response=$(curl -s "$API_URL/jobs/$job_id")
            status=$(echo "$status_response" | jq -r '.status' 2>/dev/null || echo "unknown")
            
            if [ "$status" = "done" ]; then
              echo "✓ Job completed successfully"
              
              # Check that report exists and passed
              passed=$(echo "$status_response" | jq -r '.report.passed' 2>/dev/null || echo "false")
              if [ "$passed" = "true" ]; then
                echo "✓ Fix job passed all rules"
              else
                echo "✗ Fix job failed rules"
                echo "Report: $(echo "$status_response" | jq -r '.report' 2>/dev/null)"
                exit 1
              fi
              
              # Try to download the result
              download_code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/jobs/$job_id/download")
              if [ "$download_code" = "200" ]; then
                echo "✓ Result file is downloadable"
              else
                echo "✗ Result download returned HTTP $download_code"
                exit 1
              fi
              
              exit 0
            elif [ "$status" = "failed" ]; then
              echo "✗ Job failed"
              echo "Error: $(echo "$status_response" | jq -r '.error' 2>/dev/null)"
              exit 1
            fi
            
            echo "  Status: $status (attempt $i/30)"
            sleep 1
          done
          
          echo "✗ Job did not complete within 30 seconds"
          exit 1

      - name: Report success
        if: success()
        run: |
          echo "════════════════════════════════════════"
          echo "✓ All production smoke tests passed"
          echo "  - API health endpoint: OK"
          echo "  - Web routes (/, /fix, /portals, /guides, sample guides): OK"
          echo "  - sitemap.xml includes /guides: OK"
          echo "  - API presets endpoint: OK"
          echo "  - API stats endpoint: OK"
          echo "  - End-to-end fix job: OK"
          echo "════════════════════════════════════════"

      - name: Report failure
        if: failure()
        run: |
          echo "════════════════════════════════════════"
          echo "✗ Production smoke test FAILED"
          echo "  Check the logs above for details"
          echo "════════════════════════════════════════"
          exit 1
