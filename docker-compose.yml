# Local stack: API (HTTP), worker (same image, consumes jobs), RabbitMQ, web.
# Copy .env.example to .env and fill in anything you need. Stripe and PostHog
# stay off when their keys are empty.

services:
  rabbitmq:
    image: rabbitmq:3.13-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./api
    environment:
      CHOWBEA_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CHOWBEA_CORS_ORIGINS: http://localhost:3000
      CHOWBEA_DATA_DIR: /data
      CHOWBEA_RUN_WORKER: "false"
      CHOWBEA_TRUST_FORWARDED_IP: "true"
      PORT: "8000"
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ./api
    environment:
      CHOWBEA_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CHOWBEA_CORS_ORIGINS: http://localhost:3000
      CHOWBEA_DATA_DIR: /data
      CHOWBEA_RUN_WORKER: "true"
      CHOWBEA_TRUST_FORWARDED_IP: "true"
      PORT: "8000"
    volumes:
      - api-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  web:
    build:
      context: ./web
      args:
        # Browser-facing origin of the API (not the docker DNS name).
        VITE_API_URL: http://localhost:8000
        VITE_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
