# Portal upload-limit presets for the fix job.
# last_checked dates are ISO dates of the last human/source review.
# Target encode size is ~10% under max_bytes (see TARGET_RATIO in fix.py).
# verified=true only when an official page states the limit (see notes).

presets:
  - id: uk-passport-online
    name: UK passport online photo
    accepted_types: [jpeg]
    min_bytes: 51200          # 50 KB
    max_bytes: 10485760       # 10 MB
    min_width: 600
    min_height: 750
    orientation: any
    colour: true
    do_not_crop: true
    source_url: https://www.gov.uk/photos-for-passports
    last_checked: "2026-10-13"
    verified: true
    notes: "GOV.UK digital photos: colour, 600×750 min, 50KB–10MB, do not crop. JPEG is required by the photo-code service (https://www.passport.service.gov.uk/help/photo-codes)."

  - id: uk-visa-face
    name: UK visa face photo
    accepted_types: [jpeg]
    min_bytes: 51200          # 50 KB
    max_bytes: 6291456        # 6 MB
    min_width: 600
    min_height: 750
    orientation: portrait
    colour: true
    do_not_crop: true
    source_url: https://www.gov.uk/guidance/how-to-take-a-photo-for-a-visa-application-or-permission
    last_checked: "2026-10-13"
    verified: true
    notes: "Official guidance: JPG/JPEG, colour, vertically orientated, 50KB–6MB, at least 600×750."

  - id: ucas-documents
    name: UCAS documents
    accepted_types: [pdf, jpeg, odt]
    max_bytes: 5242880        # 5 MB per file
    orientation: any
    no_password: true
    source_url: https://www.ucas.com/applying/applying-to-university/uploading-documents-to-your-application
    last_checked: "2026-10-13"
    verified: true
    notes: "Official applicant FAQ: PDF, JPEG/JPG or ODT, 5MB per file, no password, no HEIC. PNG/DOC/DOCX appear in a 2025 UCAS proposal but not on the live FAQ, so they are converted to PDF here rather than listed as accepted."

  - id: saas-documents
    name: SAAS document upload
    accepted_types: [jpeg, tiff, pdf]
    max_bytes: 5242880        # 5 MB
    orientation: any
    no_password: true
    source_url: https://www.edocs.saas.gov.uk/help/document_upload_guide.pdf
    last_checked: "2026-10-13"
    verified: true
    notes: "Official SAAS Document Upload Service guide: JPG/JPEG, TIFF/TIF or PDF, 5MB per file (max 5 files per transaction)."

  - id: ukvcas
    name: UKVCAS
    accepted_types: [pdf, jpeg, png]
    preferred_type: pdf
    max_bytes: 6291456        # 6 MB
    orientation: any
    no_password: true
    source_url: https://www.ukvcas.co.uk/help-support/ourinfo/prepareDocuments
    last_checked: "2026-10-13"
    verified: true
    notes: "UKVCAS 'Preparing your documents': PDF preferred, JPG or PNG, not password-protected, no larger than 6MB."

  - id: vfs-global
    name: VFS Global
    accepted_types: [pdf, jpeg, png]
    max_bytes: 2097152        # 2 MB
    orientation: any
    no_password: true
    source_url: https://www.vfsglobal.com/
    last_checked: "2026-10-13"
    verified: false
    notes: "VFS file-size caps vary by country VAC and programme. No single official UK-wide byte limit is published on vfsglobal.com. 2MB is a conservative target, not an official figure — check the country page before relying on it."

  - id: nhs-jobs
    name: NHS Jobs
    accepted_types: [pdf, doc, docx]
    preferred_type: pdf
    max_bytes: 1048576        # 1 MB
    orientation: any
    no_password: true
    source_url: https://faq.nhsbsa.nhs.uk/knowledgebase/article/KA-25732/en-us
    last_checked: "2026-10-13"
    verified: true
    notes: "Official NHSBSA FAQ for supporting documents on a job listing: DOC, DOCX or PDF, 1MB each (up to 4 files). This is the employer supporting-document limit, not an applicant CV upload — NHS Jobs applicants cannot upload a CV file and must paste text."

